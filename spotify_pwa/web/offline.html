<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spotify - Offline</title>
  <style>
    body {
      background: #191414;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .offline-container {
      text-align: center;
      max-width: 400px;
    }
    h1 {
      color: #1DB954;
      font-size: 28px;
      margin-bottom: 12px;
    }
    p {
      font-size: 16px;
      color: #B3B3B3;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 16px;
    }
    button {
      background: #1DB954;
      border: none;
      color: #000;
      padding: 12px 32px;
      font-size: 16px;
      border-radius: 24px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    button:hover {
      background: #1ed760;
    }
    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="icon">📡</div>
    <h1>No Connection</h1>
    <p>You're currently offline. Check your internet connection and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
